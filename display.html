<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display element</title>
<style>
    
    .para1{
        border: solid red 10px;
        width: 100px;
        height:100px;
        padding: 100px;
        margin:100px;

    }
    .para2{

        border: line rgb(109, 16, 16) 10px ;
        width: 10px;
        height:39px;
        padding: 50px;
        margin:50px;
    }
    #para2{
         border: line rgb(14, 115, 26) 10px ;
        width: 10px;
        height:39px;
        padding: 5px;
        margin:5px;
        box-sizing: border-box;
    }

    #para21{
         border: line pink 10px ;
        width: 10px;
        height:39px;
        padding: 50px;
        margin:50px;
        display:block
    }

</style>

</head>

<body>

    <!-- This is the block element ......... -->

    <div>
    <p class="para1"> 
     hello nikita 8.00
    </p>

    <p class="para1"> 
        hello nikita Tayade 4.00000
    </p>

    </div>

    <!-- This is the inline element........... -->

    <span>

    <h4 id="para2"> 
        hello nikita Tayade 2.099999
    </h4>

    <h4 id="para21"> 
        hello nikita Tayade 2.0000
    </h4>

    </span> 

</body>
</html>
