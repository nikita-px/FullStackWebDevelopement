<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>
         Personal Information   
        </legend>
        <label for="name" >Name:</label>
        <input type="text" id="name" name="name">
        <!-- email -->
         <label for="emailid" >Email:</label>
        <input type="email" id="emailid" name="emailid">
        <!-- phone number -->
         <label for="phoneno" >Phone:</label>
        <input type="tel" id="phoneno" name="phoneno">
        <!-- Date of Birth -->
         <label for="dob" >Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <!-- Gender -->
        <label for="gender" >Gender:</label>
        <select id="gender" name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>

    <!-- country -->
     <label for="occu">State:</label>
        <select id="occu" name="occu">
            <option value="student">United State</option>
            <option value="teacher">India</option>
            <option value="engineer">Canada</option>
            <option value="doctor">mexico</option>
        </select>

    </fieldset>

    <fieldset>
        <legend>Address</legend>
        <label for="address">Address:</label>
        <input type="text" id="address" name="address">
        <label for="city">City:</label>     
        <input type="text" id="city" name="city">
        <label for="state">State:</label>
        <input type="text" id="state" name="state">
        <label for="code">State:</label>
        <input type="text" id="code" name="code">
        
    </fieldset>

    <fieldset>
        <legend>Education</legend>
        <label for="education">Comments:</label>
        <textarea id="education" name="education" rows="4" cols="50">
        </textarea>

    </fieldset>
    <button type="submit">Submit</button>
</body>
</html>
